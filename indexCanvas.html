<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机像素画布</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 5px;
        }
        .stroked-text {
            color: #000; /* 文本颜色 */
            font-size: 18px; /* 文本大小 */
            -webkit-text-stroke: 1px #e1e41c; /* 描边宽度 和 颜色 */
            text-shadow: 1px 1px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff; /* 描边效果 */
        }
    </style>
</head>
<body>
    <div id="controls">
        <label for="fps">刷新率 (每秒帧数): </label>
        <input type="number" id="fps" value="60" min="1" max="600">
        <a href="./indexCanvas.html" class="stroked-text">Canvas</a>
        <a href="./indexWebGl.html">WebGL</a>
        <a href="./indexWebGpu.html">WebGPU</a>
    </div>
    <canvas id="randomCanvas"></canvas>
    <script>
        let fps = 60;
        let lastTime = 0;
        let canvas, context, imageData, data32;

        function initCanvas() {
            canvas = document.getElementById('randomCanvas');
            context = canvas.getContext('2d');
            resizeCanvas();
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // Create reusable ImageData object
            imageData = context.createImageData(canvas.width, canvas.height);
            // Use Uint32Array view for faster pixel manipulation (4x faster than byte access)
            data32 = new Uint32Array(imageData.data.buffer);
        }

        function drawRandomPixels() {
            // Generate random pixels using Uint32Array for better performance
            for (let i = 0; i < data32.length; i++) {
                // Pack RGBA into single 32-bit value: 0xAABBGGRR
                const r = Math.floor(Math.random() * 256);
                const g = Math.floor(Math.random() * 256);
                const b = Math.floor(Math.random() * 256);
                const a = 255;
                data32[i] = (a << 24) | (b << 16) | (g << 8) | r;
            }

            context.putImageData(imageData, 0, 0);
        }

        function animate(time) {
            if (time - lastTime >= 1000 / fps) {
                drawRandomPixels();
                lastTime = time;
            }
            requestAnimationFrame(animate);
        }

        function startDrawing() {
            const fpsInput = document.getElementById('fps');
            fps = parseInt(fpsInput.value, 10);
        }

        window.onload = () => {
            initCanvas();
            drawRandomPixels();
            startDrawing();
            document.getElementById('fps').addEventListener('input', startDrawing);
            requestAnimationFrame(animate);
        };

        window.onresize = () => {
            resizeCanvas();
            drawRandomPixels();
        };
    </script>
</body>
</html>
